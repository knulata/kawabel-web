name: Supabase keepalive

# Hits /api/health (which does a real write into the `keepalive` table) so
# Supabase's free-tier 7-day inactivity auto-pause never triggers. Runs 4x/day
# for wide margin — independent of the Vercel Hobby cron, which is best-effort
# and was missing enough days to let the project go idle.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          set -euo pipefail
          body=$(curl -sS --fail --max-time 30 https://kawabel.com/api/health)
          echo "$body"
          echo "$body" | grep -q '"supabase":"connected"'
